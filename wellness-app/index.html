<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Wellness</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wellness">
<meta name="theme-color" content="#FBFAF6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: calm, encouraging, never guilt.
   IDEA: a personal pocket coach: rings and pastel tiles you tap through the day.
   PICTURE: three progress rings on Today, a body map that fills on Workout.
   COLOUR and TYPE: warm white, blue water, yellow-green food, lavender training, pink stretching and cycle; Plus Jakarta Sans.
   LAYOUT: one phone column, floating pill tab bar, bottom sheets for input. */
:root{color-scheme:light;--bg:#FBFAF6;--ink:#26262B;--soft:#4E4E56;--line:#ECEAE3;--card:#FFFFFF;
--blue:#D6E5FA;--blueD:#3F6FB8;--blueM:#4F7FCC;--green:#E4ECB4;--greenD:#5E7A1E;--greenM:#9DB53A;
--lav:#DCD3F7;--lavD:#5B4BA6;--lavM:#A99BE8;--pink:#F8D3E1;--pinkD:#B8436F;--sand:#F3E3C9;--sandD:#9A6A2A;--grey:#E3DFD6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lavD);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 110px)}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{margin:0;font-size:17px;font-weight:800}
p{margin:0}
.sub{font-size:14px;font-weight:500;color:#5E5E66}
.small{font-size:12px;font-weight:600;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tile{border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chip{align-self:flex-start;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #CFCDC6;background:#fff;font-size:14px;font-weight:700}
.btn{min-height:52px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-size:15px;font-weight:800;padding:0 20px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #CFCDC6}
.btn.small{min-height:44px;font-size:14px}
.round{width:48px;height:48px;border-radius:999px;border:none;display:flex;align-items:center;justify-content:center;flex:none}
.check{width:30px;height:30px;border-radius:999px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.check.on{background:currentColor}
.check svg{stroke:#fff}
.check:not(.on) svg{stroke:transparent}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:4px 0;background:none;border:none;border-top:1px solid #F1EFE9;text-align:left}
.listbtn:first-of-type{border-top:none}
.t15{font-size:15px;font-weight:700}
.bar{height:10px;border-radius:999px;background:#F1EFE9;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.ringwrap{position:relative;flex:none}
.ringwrap>span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(360px,calc(100% - 32px));height:64px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(38,38,43,.1);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 8px;z-index:20}
nav.tabs button{height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:#6B6B73}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke:var(--ink)}
.sheetbg{position:fixed;inset:0;background:rgba(38,38,43,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:14px}
.seg{display:grid;gap:4px;background:#ECEAE3;border-radius:999px;padding:4px}
.seg button{min-height:42px;border-radius:999px;border:none;background:transparent;font-size:13px;font-weight:700}
.seg button.on{background:#fff}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{min-height:44px;min-width:44px;padding:0 14px;border-radius:14px;border:1.5px solid #CFCDC6;background:#fff;font-weight:800}
.choices button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.foods{display:flex;flex-wrap:wrap;gap:8px}
.foods button{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid #E2DFD7;background:#fff;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.foods button i{font-style:normal;font-weight:600;color:var(--soft);font-size:12px}
.foods button.mine{border-color:#C7D77C;background:#F6F9E6}
.foods button.del{border-color:#E3B9C9;background:#FBEFF3}
.eaten{display:flex;flex-direction:column;gap:6px;background:#F6F9E6;border-radius:18px;padding:10px 12px}
.eaten .between button{width:32px;height:32px;border-radius:999px;border:none;background:#fff;font-size:16px;font-weight:800}
.addrow{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:end}
.addrow input{min-height:44px;border-radius:14px;border:1.5px solid #E2DFD7;background:#fff;padding:8px 10px;font-size:16px;font-weight:600;color:var(--ink);width:100%}
.num{width:100%;min-height:44px;border-radius:14px;border:none;background:#F4F2EC;text-align:center;font-size:16px;font-weight:700}
.num.done{background:#EDE8FB}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--soft)}
label.f input,label.f textarea{min-height:48px;border-radius:14px;border:1.5px solid #E2DFD7;background:#fff;padding:10px 12px;font-size:16px;font-weight:600;color:var(--ink)}
.anim{position:relative;border-radius:22px;height:260px;overflow:hidden}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.wa{animation:wA 2.4s infinite}.wb{animation:wB 2.4s infinite}.wc{animation:wC 2.4s infinite}
@keyframes wA{0%,30%{opacity:1}36%,94%{opacity:0}100%{opacity:1}}
@keyframes wB{0%,30%{opacity:0}36%,63%{opacity:1}69%,100%{opacity:0}}
@keyframes wC{0%,63%{opacity:0}69%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wa,.wb,.wc{animation:none}.wb,.wc{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:40;max-width:90vw;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal div{height:48px;border-radius:12px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;font-size:12px;font-weight:800}
.setgrid{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
a{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
{

const MOODS = [

const ex = (id, name, slug, sets, reps, top, unit, muscles, cues, avoid, extra) => Object.assign({id, name, slug, sets, reps, top, unit, muscles, cues, avoid}, extra || {});
const SESSIONS = {

    ex('rdl','Dumbbell Romanian deadlift','dumbbell-romanian-deadlift',3,'10–12 · 3 sec down',12,'kg',['hamstrings','glutes','lowerBack'],['Soft knees, push your hips straight back.','Dumbbells slide down your thighs, back flat.','Lower for 3 seconds until you feel your hamstrings.','Squeeze your glutes to stand tall.'],'Rounding your back to reach lower.',{step:2}),
    ex('ht','Hip thrust','hip-thrust',3,'10–12',12,'kg',['glutes','hamstrings'],['Upper back on the bench, feet flat.','Drive through your heels until your body is flat.','Tuck your chin, squeeze 1 sec at the top.'],'Arching your lower back at the top.',{step:2}),
    ex('lsd','Lateral step-down, low box','step-down',2,'8–10 per leg',10,'kg',['quads','glutes'],['Stand side-on on a low box.','Slowly lower the free heel to tap the floor.','Standing knee tracks over your toes.'],'Letting the knee cave inwards.',{note:'Shown facing forward. Do yours side-on to the box.',step:1}),
    ex('bal','Single-leg balance',null,2,'30 sec per leg',30,'sec',['calves','glutes','core'],['Stand tall on one leg, soft knee.','Fix your eyes on one point.','When it gets easy, close your eyes.'],'Locking the standing knee.'),
    ex('suit','Suitcase carry','farmer-carry',2,'30 m per side',null,'kg',['core','forearms','traps'],['Hold one heavy dumbbell at your side.','Walk tall with level shoulders.','Brace your core.'],'Leaning towards or away from the weight.',{note:'Shown with two weights. Hold just one.',step:2}),
    ex('agi','Agility finisher','lateral-shuffle',1,'5 min · shuffles, side hops, quick feet',null,'min',['quads','calves','glutes'],['Lateral shuffles, small side hops, quick feet.','Light and springy, stay low.','Stop if your knees complain.'],'Big jumps or landing stiff-legged.',{fromWeek:4,optional:true})
  ]},
  UA: {name:'Upper A', exercises:[
    ex('row','Single-arm dumbbell row','one-arm-dumbbell-row',3,'10–12 per arm',12,'kg',['back','arms'],['Hand and knee on a bench, flat back.','Pull the dumbbell to your hip.','Lower slowly.'],'Twisting your torso to lift.',{step:1}),
    ex('idp','Incline dumbbell press','incline-dumbbell-press',3,'10–12',12,'kg',['chest','shoulders','arms'],['Bench at a low incline.','Press up and slightly together.','Lower with control to chest level.'],'Flaring your elbows straight out.',{step:1}),
    ex('yt','Prone incline Y-T raise','prone-y-raise',3,'10 of each',10,'kg',['back','shoulders','traps'],['Lie face down on an incline bench.','Raise light dumbbells into a Y, then a T.','Squeeze your shoulder blades.'],'Shrugging towards your ears.',{note:'Shown as the Y. Add the T with arms out to the side.',step:1}),

    ex('dl','Dumbbell or trap-bar deadlift','trap-bar-deadlift',3,'8–10',10,'kg',['glutes','hamstrings','quads','lowerBack'],['Feet hip-width, weight close.','Flat back, push the floor away.','Stand tall, lower with control.'],'Rounding your back.',{step:2.5}),

    ex('calf','Standing calf raise','calf-raise',3,'12–15',15,'kg',['calves'],['Rise high onto your toes.','Pause at the top.','Lower slowly.'],'Bouncing at the bottom.',{step:2}),

    ex('sp','Side plank','side-plank',2,'20–30 sec per side',30,'sec',['core'],['Elbow under shoulder.','Hips high, body in a line.','Breathe steadily.'],'Letting your hips sag.'),
    ex('agi2','Agility finisher','lateral-shuffle',1,'5 min · shuffles, side hops, quick feet',null,'min',['quads','calves','glutes'],['Lateral shuffles, small side hops, quick feet.','Light and springy, stay low.','Stop if your knees complain.'],'Big jumps or landing stiff-legged.',{fromWeek:4,optional:true})
  ]},
  UB: {name:'Upper B', exercises:[

const SESSION_ORDER = ['LA','UA','LB','UB'];
/* extra swap options (no animation) */

const MUSCLE_NAMES = {quads:'quads', hamstrings:'hamstrings', glutes:'glutes', adductors:'inner thighs', calves:'calves', core:'core', lowerBack:'lower back', back:'back', chest:'chest', shoulders:'shoulders', arms:'arms', forearms:'grip', traps:'traps'};
function allExercises() { const seen = {}, out = []; SESSION_ORDER.forEach(c => SESSIONS[c].exercises.forEach(e => { if (!seen[e.id]) { seen[e.id] = 1; out.push(e); } })); return out.concat(EXTRA, (S.settings.customEx || []).map(c => ex(c.id, c.name, null, 3, c.reps || '10\u201312', null, c.unit || 'kg', c.muscles || [], [], '', {step:1}))); }

const SPLIT = [
  {id:'hip', name:'Half-kneeling hip flexor', dose:'2 × 45 sec per side'},

/* ---------- plan logic ---------- */
function isGymDay(s) { const k = DOW[parse(s).getDay()]; const g = S.settings.gym; if (!g.includes(k)) return false; if (weekOf(s) <= 2) { const order = ['Mo','Tu','We','Th','Fr','Sa','Su'].filter(x => g.includes(x)); return order.indexOf(k) < 3; } return true; }
function sessionFor(s) { const k = DOW[parse(s).getDay()]; const order = ['Mo','Tu','We','Th','Fr','Sa','Su'].filter(x => S.settings.gym.includes(x)); const i = order.indexOf(k); return i < 0 ? null : SESSION_ORDER[i % 4]; }

function parseSteps(t) {
  t = String(t || '').replace(/[\s\u00a0\u202f']/g, '');
  if (!/^\d[\d.,]*$/.test(t)) return null;
  const n = /^\d{1,3}([.,]\d{3})+$/.test(t) ? Number(t.replace(/[.,]/g, '')) : Number(t.split(/[.,]/)[0]);
  return n >= 0 && n < 200000 ? Math.round(n) : null;
}

/* ---------- sync with Claude (private per-person store) ---------- */
const SYNC = {on:false, col:null, state:'', busy:false, timer:null};
function setSync(t) { SYNC.state = t; const el = document.getElementById('syncState'); if (el) el.textContent = t; }

async function flush() {
  if (!SYNC.col || SYNC.busy) return; SYNC.busy = true;
  try {
    while (dirty.size) {
      const key = dirty.values().next().value; dirty.delete(key);
      const body = key === 'meta' ? {settings:S.settings, cycle:S.cycle, meas:S.meas, lastBackup:S.lastBackup || null, updated:S.updated.meta || Date.now()} : {date:key.slice(2), data:S.days[key.slice(2)], updated:S.updated[key] || Date.now()};

}

    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    SYNC.col = db.collection('data/users/' + id); SYNC.on = true; setSync('Syncing…');
    const snap = await SYNC.col.limit(1000).get();
    let changed = false; const seen = new Set();
    snap.docs.forEach(doc => {
      const b = doc.data(); if (!b) return; seen.add(doc.id);
      const localT = S.updated[doc.id] || 0, remoteT = b.updated || 0;
      if (remoteT > localT) {
        if (doc.id === 'meta') { if (b.settings) S.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), b.settings); if (b.cycle) S.cycle = b.cycle; if (b.meas) S.meas = b.meas; S.lastBackup = b.lastBackup || S.lastBackup; }
        else if (doc.id.startsWith('d-') && b.data) S.days[doc.id.slice(2)] = b.data;
        S.updated[doc.id] = remoteT; changed = true;
      } else if (localT > remoteT) dirty.add(doc.id);
    });
    Object.keys(S.updated).forEach(k => { if (!seen.has(k)) dirty.add(k); });
    persistLocal(); if (changed) render(); setSync('Synced ✓'); scheduleSync();
  } catch (e) { setSync('Saved on this device'); }
}


/* ---------- import from Apple Health via Shortcut (?steps=1234&period=YYYY-MM-DD&weight=88.4) ---------- */
function importFromURL() {
  try {
    const q = new URLSearchParams(location.search); if (![...q.keys()].length) return;
    const t = todayStr(); const got = [];
    if (q.has('steps')) { const v = parseInt(q.get('steps'), 10); if (v >= 0 && v < 200000) { day(t).steps = v; saveDay(t); got.push(v.toLocaleString('en-US') + ' steps'); } }
    if (q.has('period')) { const p = (q.get('period') || '').slice(0, 10); if (/^\d{4}-\d{2}-\d{2}$/.test(p) && p <= t && !(S.cycle.starts || []).includes(p)) { const prev = (S.cycle.starts || []).filter(x => Math.abs(diffDays(x, p)) < 15); if (!prev.length) { S.cycle.starts = (S.cycle.starts || []).concat([p]); saveMeta(); got.push('period start'); } } }
    if (q.has('weight')) { const w = parseFloat(String(q.get('weight')).replace(',', '.')); if (w > 30 && w < 250) { day(t).am.weight = Math.round(w * 10) / 10; saveDay(t); got.push(w + ' kg'); } }
    history.replaceState(null, '', location.pathname);
    if (got.length) setTimeout(() => toast('From Health: ' + got.join(', ')), 300);
  } catch (e) {}
}

/* ---------- boot ---------- */
fetch('bodymap.json').then(r => r.json()).then(b => { BODY = b; if (tab === 'workout') { const y = window.scrollY; render(); window.scrollTo(0, y); } }).catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && viewDate > todayStr()) viewDate = todayStr(); if (!document.hidden && tab === 'today') render(); });
importFromURL();
render();
initSync();
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self && !/claude\.ai|claudeusercontent/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
